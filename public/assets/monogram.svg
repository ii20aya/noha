<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" role="img" aria-label="م ن">
<defs>
 <linearGradient id="ink" x1=".2" y1="0" x2=".8" y2="1">
  <stop stop-color="#b5a890"/><stop offset=".48" stop-color="#d5cbb8"/><stop offset="1" stop-color="#b8aa91"/>
 </linearGradient>
 <filter id="depth" x="-15%" y="-20%" width="130%" height="150%" color-interpolation-filters="sRGB">
  <feGaussianBlur in="SourceAlpha" stdDeviation=".65" result="soft"/>
  <feOffset in="soft" dx="0" dy="1.5" result="light"/>
  <feFlood flood-color="#fff9e9" flood-opacity=".9" result="white"/>
  <feComposite in="white" in2="light" operator="in" result="rim"/>
  <feOffset in="soft" dx="0" dy="-1.3" result="dark"/>
  <feFlood flood-color="#766b56" flood-opacity=".6" result="shade"/>
  <feComposite in="shade" in2="dark" operator="in" result="cut"/>
  <feMerge><feMergeNode in="rim"/><feMergeNode in="cut"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
</defs>
<g fill="url(#ink)" stroke="#bcaf97" stroke-width=".45" filter="url(#depth)">
 <!-- The upper meem returns into its bowl on the right. -->
 <path d="M21 93C47 44 83 49 130 65C179 83 226 107 279 76C287 62 292 43 304 22C313 5 325 5 333 19C344 36 354 56 350 70C347 85 332 89 309 78C298 108 281 126 250 129C198 134 161 106 116 90C77 76 49 75 21 93ZM311 54C321 63 335 68 337 62C336 54 330 43 324 37Z"/>
 <!-- The noon sweeps beneath the meem and overlaps its lower return. -->
 <path d="M16 125C38 86 68 83 106 91C153 101 202 127 247 112C274 103 292 85 306 63C296 105 276 134 239 141C193 150 145 127 101 116C68 108 43 110 16 125Z"/>
 <path d="M213 40L221 23L240 34L232 52Z"/>
</g>
</svg>
